name: macOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    if: github.repository == 'yamakze/TiebaPure-Mac'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check release tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'The release tag must match the version in Resources/Info.plist.' >&2
            exit 1
          fi
          scripts/verify-project.sh
          scripts/release-notes.sh "$RELEASE_TAG" >/dev/null
      - name: Check release build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 2 --json tagName --jq '.[].tagName' | awk -v tag="$RELEASE_TAG" '$0 != tag && !found { print; found = 1 }')
          if [[ -n "$previous" ]]; then
            git fetch --depth=1 --no-tags origin "refs/tags/$previous"
            git show FETCH_HEAD:Resources/Info.plist | python3 scripts/lib/check-release-build.py Resources/Info.plist
          fi
      - name: Run tests
        run: swift test
      - name: Package ad-hoc Apple Silicon app
        if: vars.MACOS_SIGN_IDENTITY == ''
        env:
          CODE_SIGN_IDENTITY: '-'
          SPARKLE_PUBLIC_KEY: ''
        run: |
          set -euo pipefail
          scripts/build-app.sh release
          app=artifacts/macos/TiebaPure-Mac.app
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist" >/dev/null 2>&1; then
            echo 'The ad-hoc release must have automatic updates disabled.' >&2
            exit 1
          fi
          output="artifacts/release/$RELEASE_TAG"
          archive="TiebaPure-Mac-${RELEASE_TAG#v}.zip"
          mkdir -p "$output"
          ditto -c -k --keepParent "$app" "$output/$archive"
          scripts/release-notes.sh "$RELEASE_TAG" > "$output/RELEASE_NOTES.md"
          cat > "$output/PACKAGE_NOTES.md" <<'EOF'
          ## 下载与升级 / Download and upgrade

          适用于搭载 Apple 芯片、运行 macOS 14 或更高版本的 Mac。用 `SHA256SUMS.txt` 核对 ZIP，解压后将应用拖入「应用程序」。本版使用 ad-hoc 签名，未经 Apple 公证，应用内自动更新未启用。首次打开受阻时可参阅 [Apple 支持](https://support.apple.com/102445)。

          Requires an Apple Silicon Mac running macOS 14 or later. Verify the ZIP against `SHA256SUMS.txt`, then unpack it and move the app to Applications. This build is ad-hoc signed and distributed without Apple notarization or in-app automatic updates. For first-launch alerts, see [Apple Support](https://support.apple.com/en-us/102445).
          EOF
          (cd "$output" && shasum -a 256 "$archive" > SHA256SUMS.txt)
      - name: Sign and notarize Apple Silicon app
        if: vars.MACOS_SIGN_IDENTITY != ''
        env:
          CODE_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${CODE_SIGN_IDENTITY:?Set MACOS_SIGN_IDENTITY}"
          : "${MACOS_CERTIFICATE_P12:?Set MACOS_CERTIFICATE_P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set MACOS_CERTIFICATE_PASSWORD}"
          : "${APPLE_ID:?Set APPLE_ID}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          : "${APPLE_APP_PASSWORD:?Set APPLE_APP_PASSWORD}"
          if [[ -z "$SPARKLE_PUBLIC_KEY" ]]; then
            if ! grep -qs '[^[:space:]]' Resources/SparklePublicKey.txt; then
              echo 'Set SPARKLE_PUBLIC_KEY or commit Resources/SparklePublicKey.txt.' >&2
              exit 1
            fi
            unset SPARKLE_PUBLIC_KEY
          fi
          work=$(mktemp -d "$RUNNER_TEMP/tiebapure-signing.XXXXXX")
          keychain="$work/release.keychain-db"
          trap 'security delete-keychain "$keychain"; rm -rf "$work"' EXIT
          password=$(uuidgen)
          echo "::add-mask::$password"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$work/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$work/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -F -- "$CODE_SIGN_IDENTITY")
          if [[ "$identity" != *'"Developer ID Application:'* ]]; then
            echo 'Developer ID Application signing is required.' >&2
            exit 1
          fi
          scripts/build-app.sh release
          app=artifacts/macos/TiebaPure-Mac.app
          ditto -c -k --keepParent "$app" "$work/notarize.zip"
          xcrun notarytool submit "$work/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Generate signed Sparkle update feed
        if: vars.MACOS_SIGN_IDENTITY != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/release-assets.py "$RELEASE_TAG" artifacts/macos/TiebaPure-Mac.app
      - name: Include complete changelog
        run: cp CHANGELOG.md "artifacts/release/$RELEASE_TAG/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: artifacts/release/${{ env.RELEASE_TAG }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: release
      - name: Create or update release draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          version=${RELEASE_TAG#v}
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('RELEASE_NOTES.md').read_text()
          if Path('PACKAGE_NOTES.md').exists():
              notes += '\n\n' + Path('PACKAGE_NOTES.md').read_text()
          Path('notes.md').write_text(notes)
          PY
          assets=("TiebaPure-Mac-$version.zip" SHA256SUMS.txt CHANGELOG.md)
          if [[ -f appcast.xml ]]; then assets+=(appcast.xml); fi
          owner=${GH_REPO%%/*}
          repo=${GH_REPO#*/}
          state=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$tag:String!){
              repository(owner:$owner,name:$repo){ release(tagName:$tag){ isDraft } }
            }' -f owner="$owner" -f repo="$repo" -f tag="$RELEASE_TAG" \
            --jq '.data.repository.release | if . == null then "missing" elif .isDraft then "draft" else "published" end')
          case "$state" in
            missing)
              gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag \
                --title "TiebaPure-Mac $version" --notes-file notes.md
              ;;
            draft)
              gh release edit "$RELEASE_TAG" --notes-file notes.md
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              ;;
            published)
              echo 'Release is already published. The new build is available as a workflow artifact.'
              ;;
            *) echo "Unexpected release state: $state" >&2; exit 1 ;;
          esac
