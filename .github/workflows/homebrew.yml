name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yamakze/TiebaPure-Mac' && (github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download published release and generate Cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ -z "$tag" ]]; then
            tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected the release to use a vX.Y.Z tag' >&2
            exit 1
          fi
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          archive="TiebaPure-Mac-${version}.zip"
          gh release download "$tag" --pattern "$archive" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release"
          python3 - "$RUNNER_TEMP/release" "$archive" <<'PY'
          import hashlib, sys
          from pathlib import Path
          directory, name = Path(sys.argv[1]), sys.argv[2]
          expected = dict(line.split('  ', 1)[::-1] for line in (directory / 'SHA256SUMS.txt').read_text().splitlines())
          with (directory / name).open('rb') as file:
              actual = hashlib.file_digest(file, 'sha256').hexdigest()
          if expected[name] != actual:
              raise SystemExit('Published archive does not match SHA256SUMS.txt')
          PY
          python3 scripts/lib/update-homebrew-cask.py "$tag" "$RUNNER_TEMP/release/$archive"
        id: cask
      - name: Publish Cask update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain -- Casks/tiebapure-mac.rb)" ]]; then
            echo 'Cask is already current.'
            exit 0
          fi
          version="${{ steps.cask.outputs.version }}"
          base="${{ github.event.repository.default_branch }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/tiebapure-mac.rb
          git commit -m "chore: update Homebrew Cask for v${version}"
          if ! git push origin "HEAD:${base}"; then
            branch="chore/homebrew-cask-${version}"
            git push --force-with-lease origin "HEAD:refs/heads/${branch}"
            gh pr create --base "$base" --head "$branch" \
              --title "chore: update Homebrew Cask for v${version}" \
              --body "Automated Homebrew Cask update for release v${version}." || true
          fi
