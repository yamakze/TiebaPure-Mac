name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README*', 'local/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', 'README*', 'local/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then xcode=/Applications/Xcode.app; fi
          echo "Using Xcode: $xcode"
          sudo xcode-select -s "$xcode"
      - name: Verify native project boundaries
        run: scripts/verify-project.sh
      - name: Core regression tests
        run: swift test
      - name: Release app bundle
        run: scripts/build-app.sh release
      - name: Archive local validation build
        run: ditto -c -k --keepParent artifacts/macos/TiebaPure-Mac.app artifacts/macos/TiebaPure-Mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TiebaPure-Mac-validation
          path: artifacts/macos/TiebaPure-Mac.zip
