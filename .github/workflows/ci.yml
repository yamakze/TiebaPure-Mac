name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Verify native project boundaries
        run: scripts/verify-project.sh
      - name: Core regression tests
        run: swift test
      - name: Release app bundle
        run: scripts/build-app.sh release
      - name: Archive local validation build
        run: ditto -c -k --keepParent build/TiebaPure-Mac.app build/TiebaPure-Mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TiebaPure-Mac-validation
          path: build/TiebaPure-Mac.zip
